[build]
  publish = "dist"

[[redirects]]
  from = "https://buraknazifakgul.com/*"
  to = "https://burakakgul.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.gif"
  status = 200

[[redirects]]
  from = "/images/profilfoto.jpg"
  to = "/assets/profile.jpg"
  status = 301

[[redirects]]
  from = "/images/social-preview.png"
  to = "/assets/social-preview.png"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
